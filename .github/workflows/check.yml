name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every lib.js copy matches mods/sesh-sidebar/lib.js
        run: sh mods/sesh-sidebar/sync-lib.sh --check
      - name: Scripts and mods parse
        run: sh scripts/check.sh
