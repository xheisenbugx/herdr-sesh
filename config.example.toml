# Copy this file to the path printed by `herdr-sesh config-path`.
# All sections are optional.

dir_length = 1
git_dir_length = 1
blacklist = ["scratch"]
sort_order = ["herdr", "config", "zoxide"]

[default_session]
startup_command = ""
preview_command = "eza --all --git --icons=auto --color=always -- {}"
# tabs = ["editor", "git"]

[frecency]
list_command = "zoxide query --list --score"
query_command = "zoxide query {}"
add_command = "zoxide add {}"

[tui]
prompt = "⚡  "
show_icons = true
preview = true
preview_width = 55
reverse = true

[[session]]
name = "herdr-sesh"
path = "~/code/herdr-sesh"
alias = "hs"
icon = "󰆍"
startup_command = "nvim"
preview_command = "bat --color=always README.md"
tabs = ["editor", "git"]

[[tab]]
name = "editor"
startup_command = "nvim"

[[tab]]
name = "git"
startup_command = "lazygit"

[[wildcard]]
pattern = "~/work/**"
startup_command = "nvim"
preview_command = "eza --all --git --icons=auto --color=always -- {}"
icon = "󰲋"
